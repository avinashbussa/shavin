name: DCO sign-off

# Every commit in a pull request must carry a `Signed-off-by:` trailer
# (Developer Certificate of Origin). See CONTRIBUTING.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  dco:
    name: Check commit sign-offs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email=$(git show -s --format='%ae' "$sha")
            case "$author_email" in
              *"[bot]@users.noreply.github.com") continue ;;   # Dependabot, Renovate, etc.
            esac
            if ! git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $(git show -s --format='%h %s' "$sha") is missing a Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Sign off your commits with 'git commit -s'. To fix existing ones:"
            echo "  git rebase --signoff ${{ github.event.pull_request.base.ref }} && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
