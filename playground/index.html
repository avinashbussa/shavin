<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shavin Playground</title>
    <link rel="icon" type="image/svg+xml" href="/shavin-favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Same appearance key as the docs site, dark by default.
      try {
        var mode = localStorage.getItem("shavin-appearance");
        document.documentElement.classList.toggle("dark", mode !== "light");
      } catch (e) {}
    </script>
  </head>
  <body class="bg-canvas text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
